name: CantileverBeam2D
description: >-
  Two-dimensional cantilever beam reliability problem from Rajashekhar and Ellingwood (1993)
tags:
  - reliability

dimensions:
  input: 2
  output: 1

inputs:
  Rajashekhar1993:
    description: Probabilistic input model from Rajashekhar and Ellingwood (1993)
    marginals:
      - name: W
        distribution: normal
        parameters: [1000.0, 200.0]
        description: Load per unit area [N/m^2]
      - name: H
        distribution: normal
        parameters: [250.0, 37.5]
        description: Depth of the cross-section [mm]
    copulas: null

parameters:
  keyword_descriptions:
    modulus: Modulus of elasticity 'E' [MPa]
    span: Span of the beam 'l' [mm]
  sets:
    Rajashekhar1993:
      modulus: 26000.0
      span: 6000.0
      description: Parameter set from Rajashekhar and Ellingwood (1993)