name: Sulfur
description: >-
  Nine-dimensional direct radiative forcing model from Charlson et al. (1992)
tags:
  - metamodeling
  - sensitivity

dimensions:
  input: 9
  output: 1

inputs:
  Penner1994:
    description: >-
      Probabilistic input model for the Sulfur model
      from Penner et al. (1994)
    marginals:
      - name: Q
        distribution: lognormal
        parameters: [$(log(71.0)), $(log(1.15))]
        description: Source strength of anthropogenic sulfur [TgS/year]
      - name: Y
        distribution: lognormal
        parameters: [$(log(0.5)), $(log(1.5))]
        description: Fraction of SO2 oxidized to sulfate aerosol [-]
      - name: L
        distribution: lognormal
        parameters: [$(log(5.5)), $(log(1.5))]
        description: Average lifetime of atmospheric sulfate [days]
      - name: Psi_e
        distribution: lognormal
        parameters: [$(log(5.0)), $(log(1.4))]
        description: Aerosol mass scattering efficiency [m^2/g]
      - name: beta
        distribution: lognormal
        parameters: [$(log(0.3)), $(log(1.3))]
        description: Fraction of light scattered into upper hemisphere [-]
      - name: f_Psi_e
        distribution: lognormal
        parameters: [$(log(1.7)), $(log(1.2))]
        description: >-
          Fractional increase in scattering efficiency
          due to hygroscopic growth [-]
      - name: T^2
        distribution: lognormal
        parameters: [$(log(0.58)), $(log(1.4))]
        description: >-
          Square of atmospheric transmittance above aerosol layer [-]
      - name: (1-Ac)
        distribution: lognormal
        parameters: [$(log(0.39)), $(log(1.1))]
        description: Fraction of earth not covered by cloud [-]
      - name: (1-Rs)^2
        distribution: lognormal
        parameters: [$(log(0.72)), $(log(1.2))]
        description: Square of surface coalbedo [-]
    copulas: null