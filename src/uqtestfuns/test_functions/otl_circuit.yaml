name: OTLCircuit
description: OTL circuit model from Ben-Ari and Steinberg (2007)
tags:
  - metamodeling
  - sensitivity

dimensions:
  input: 6
  output: 1

default_input: BenAri2007

inputs:
  BenAri2007:
    description: Input model from Ben-Ari and Steinberg (2007)
    marginals:
      - name: Rb1
        distribution: uniform
        parameters: [50.0, 150.0]
        description: Resistance b1 [kOhm]
      - name: Rb2
        distribution: uniform
        parameters: [25.0, 70.0]
        description: Resistance b2 [kOhm]
      - name: Rf
        distribution: uniform
        parameters: [0.5, 3.0]
        description: Resistance f [kOhm]
      - name: Rc1
        distribution: uniform
        parameters: [1.2, 2.5]
        description: Resistance c1 [kOhm]
      - name: Rc2
        distribution: uniform
        parameters: [0.25, 1.20]
        description: Resistance c2 [kOhm]
      - name: beta
        distribution: uniform
        parameters: [50.0, 300.0]
        description: Current gain [A]
    copulas: null