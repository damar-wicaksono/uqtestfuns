name: Rosenbrock
description: >-
  Optimization test function with a curved non-convex valley from Rosenbrock (1960)
tags:
  - optimization
  - metamodeling

dimensions:
  input: variable
  output: 1

inputs:
  Picheny2013:
    description: >-
      Search domain for the Rosenbrock function from Picheny et al. (2013)
    marginals:
      distribution: uniform
      parameters: [-5.0, 10.0]
      name: X_$idx
    copulas: null

parameters:
  keyword_descriptions:
    a: Location of the global optimum
    b: Steepness and width of the valley
    c: Shift parameter
    d: Scale parameter
  sets:
    Rosenbrock1960:
      a: 1.0
      b: 100.0
      c: 0.0
      d: 1.0
      description: Parameter set for the Rosenbrock function from Rosenbrock (1960)