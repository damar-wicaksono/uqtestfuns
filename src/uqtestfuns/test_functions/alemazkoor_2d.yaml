name: Alemazkoor2D
description: >-
  Two-dimensional high-degree polynomial from Alemazkoor and Meidani (2018)
tags:
  - metamodeling

dimensions:
  input: 2
  output: 1

evaluate: alemazkoor.evaluate_2d

inputs:
  Alemazkoor2018:
    description: >-
      Probabilistic input model from Alemazkoor and Meidani (2018)
    marginals:
      - name: X1
        distribution: uniform
        parameters: [-1.0, 1.0]
      - name: X2
        distribution: uniform
        parameters: [-1.0, 1.0]
    copulas: null