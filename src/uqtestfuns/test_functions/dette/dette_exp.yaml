name: DetteExp
description: Exponential three-dimensional function from Dette and Pepelyshev (2010)
tags:
  - metamodeling

dimensions:
  input: 3
  output: 1

evaluate: evaluate.exp

inputs:
  Dette2010:
    description: Input domain from Dette and Pepelyshev (2010)
    marginals:
      distribution: uniform
      parameters: [0.0, 1.0]
      name: x_$idx
    copulas: null