name: OTLCircuit20D
description: Twenty-dimensional OTL circuit model from Moon (2010)
tags:
  - sensitivity

dimensions:
  input: 20
  output: 1

evaluate: otl_circuit.evaluate

inputs:
  Moon2010:
    description: Input model from Moon (2010) with 14 additional inert inputs
    marginals:
      - name: Rb1
        distribution: uniform
        parameters: [50.0, 150.0]
        description: Resistance b1 [kOhm]
      - name: Rb2
        distribution: uniform
        parameters: [25.0, 70.0]
        description: Resistance b2 [kOhm]
      - name: Rf
        distribution: uniform
        parameters: [0.5, 3.0]
        description: Resistance f [kOhm]
      - name: Rc1
        distribution: uniform
        parameters: [1.2, 2.5]
        description: Resistance c1 [kOhm]
      - name: Rc2
        distribution: uniform
        parameters: [0.25, 1.20]
        description: Resistance c2 [kOhm]
      - name: beta
        distribution: uniform
        parameters: [50.0, 300.0]
        description: Current gain [A]
      - distribution: uniform
        parameters: [100.0, 200.0]
        name: Inert$idx
        description: Inert input [-]
        repeat: 14
    copulas: null