[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uqtestfuns"
version = "0.6.0"
description = "A Python library of test functions from the uncertainty quantification community with a common interface for benchmarking purpose."
readme = "README.md"
authors = [
    {name = "Damar Wicaksono", email = "damar.wicaksono@outlook.com"},
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Science/Research",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.13.3",
    "scipy>=1.7.3",
    "tabulate>=0.8.10",
    "pyyaml>=5.1",
]

[project.urls]
Homepage = "https://github.com/damar-wicaksono/uqtestfuns"
Documentation = "https://uqtestfuns.readthedocs.io/en/latest/"
Issues = "https://github.com/damar-wicaksono/uqtestfuns/issues"

[project.optional-dependencies]
dev = [
    "pytest>=4.6",
    "pytest-cov>=2.12.0",
    "pytest-randomly",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-tabulate",
    "types-setuptools",
]
docs = [
    "jupyter-book<2.0.0",
    "sphinx",
    "matplotlib>=3.7.0",
    "sphinx-proof",
    "sphinxcontrib-mermaid",
]
all = [
    "uqtestfuns[dev]",
    "uqtestfuns[docs]",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
source = ["uqtestfuns"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.paths]
source = ["src/uqtestfuns", "*/site-packages/uqtestfuns"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
show_error_context = true
pretty = true
namespace_packages = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "uqtestfuns.meta.metaspec",
    "test_uqmetaspec",
    "test_uqmetatestfun",
]
ignore_errors = true

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
