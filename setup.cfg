[tool:pytest]
testpaths = tests
addopts =
   --cov
   --strict-markers
xfail_strict = True

[coverage:run]
source = uqtestfuns
branch = True

[coverage:report]
show_missing = True
skip_covered = True

[coverage:paths]
source =
   src/uqtestfuns
   */site-packages/uqtestfuns

[tox:tox]
isolated_build = True
envlist =
   py310
   py311
   py312
   py313
   py314

[testenv]
deps =
   pytest
   pytest-cov
   pytest-randomly
   numpy>=1.13.3
   scipy>=1.7.3
   tabulate>=0.8.10
commands = pytest {posargs}

[testenv:typecheck]
deps =
   pytest
   mypy
   types-tabulate
   types-setuptools
   types-PyYAML
commands = mypy --ignore-missing-imports {posargs:src tests}

[mypy]
python_version = 3.12
warn_unused_configs = True
show_error_context = True
pretty = True
namespace_packages = True
check_untyped_defs = True

[mypy-uqtestfuns.meta.metaspec]
ignore_errors = True

[mypy-test_uqmetaspec]
ignore_errors = True

[mypy-test_uqmetatestfun]
ignore_errors = True

[testenv:format]
skip_install = True
deps =
   black
commands = black {posargs:--check --diff src tests}

[testenv:lint]
skip_install = True
deps =
   flake8
   flake8-bugbear
max-line-length = 79
commands = flake8 {posargs:src tests}
