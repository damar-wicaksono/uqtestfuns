[tool:pytest]
testpaths = tests
addopts =
   --cov
   --strict-markers
xfail_strict = True

[coverage:run]
source = uqtestfuns
branch = True

[coverage:report]
show_missing = True
skip_covered = True

[coverage:paths]
source =
   src/uqtestfuns
   */site-packages/uqtestfuns

[mypy]
python_version = 3.12
warn_unused_configs = True
show_error_context = True
pretty = True
namespace_packages = True
check_untyped_defs = True

[mypy-uqtestfuns.meta.metaspec]
ignore_errors = True

[mypy-test_uqmetaspec]
ignore_errors = True

[mypy-test_uqmetatestfun]
ignore_errors = True
