name: Testing and packaging

permissions:
  contents: read

on:
  - push

jobs:
  format:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Run ruff format check
        run: uv run --extra dev ruff format --check src tests
  lint:
    name: Check code linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Run ruff check
        run: uv run --extra dev ruff check src tests
  typecheck:
    name: Static type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Run mypy
        run: uv run --extra dev mypy src tests
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run pytest
        run: uv run --extra dev pytest
  coverage:
    name: Test (on Python 3.14) w/ coverage to CodeCov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - name: Run pytest with coverage
        run: uv run --extra dev pytest --cov-report=xml --cov-report=term
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: true
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"
      - name: Build sdist, then wheel from the sdist
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  publish:
    name: Publish package
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - format
      - lint
      - typecheck
      - test
      - coverage
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/uqtestfuns/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1