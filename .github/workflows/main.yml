name: Testing and packaging

on:
  - push

jobs:
  format:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - name: Run ruff format check
        run: uv run --extra dev ruff format --check src tests
  lint:
    name: Check code linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - name: Run ruff check
        run: uv run --extra dev ruff check src tests
  typecheck:
    name: Static type checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - name: Run mypy
        run: uv run --extra dev mypy --ignore-missing-imports src tests
  test:
    name: Test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run pytest
        run: uv run --extra dev pytest
  coverage:
    name: Test (on Python 3.14) w/ coverage to CodeCov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
      - name: Run pytest with coverage
        run: uv run --extra dev pytest --cov-report=xml --cov-report=term
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
  build_wheels:
    name: Build wheels on Ubuntu latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build
        run: python -m pip install build
      - name: Build wheels
        run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          path: ./dist/*.whl
          name: wheel

  build_sdist:
    name: Build source distribution on Ubuntu latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build
        run: python -m pip install build
      - name: Build wheels
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          path: ./dist/*.tar.gz
          name: sdist
  publish:
    name: Publish package
    if: startsWith(github.event.ref, 'refs/tags/v')
    needs:
      - format
      - lint
      - typecheck
      - test
      - coverage
      - build_wheels
      - build_sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: ./dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
