name: LinearSum
description: Linear sum with dimension-dependent inputs
tags:
  - metamodeling

dimensions:
  input: variable
  output: 1

evaluate: compute

inputs:
  Uniform:
    description: Uniform inputs generated by factory
    marginals:
      factory: create_uniform_marginals
  Scaled:
    description: Scaled inputs with configurable width
    marginals:
      factory: create_scaled_marginals
      scale: 0.5

default_input: Uniform
